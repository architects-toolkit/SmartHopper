name: Linear History

# Description: Enforces that pull requests targeting the linear-history protected
# branches are rebased onto their base and contain no merge commits.
#
# Triggers:
# - pull_request to main and related release/hotfix branches
# - merge_group checks
# - workflow_dispatch

on:
  pull_request:
    branches:
      - main
      - 'hotfix/**'
      - 'release/**'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch to check against.
        required: true
        type: string
      head_sha:
        description: Head commit SHA.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-linear-history:
    name: Check linear history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine base and head
        id: refs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE="${{ github.event.inputs.base_ref }}"
            HEAD="${{ github.event.inputs.head_sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            # merge_group payload uses a generated ref for the candidate merge
            BASE="${{ github.event.merge_group.base_ref }}"
            HEAD="${{ github.event.merge_group.head_sha }}"
          else
            BASE="${{ github.base_ref }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          fi

          # GitHub provides full refs (e.g. refs/heads/main) for merge_group and
          # workflow_dispatch; the remaining commands expect short branch names.
          BASE="${BASE#refs/heads/}"
          HEAD="${HEAD#refs/heads/}"

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Fetch base ref
        shell: bash
        run: |
          git fetch origin "${{ steps.refs.outputs.base }}"

      - name: Verify branch is rebased onto base
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "origin/${{ steps.refs.outputs.base }}" "${{ steps.refs.outputs.head }}"; then
            echo "::error::The PR branch is not rebased onto origin/${{ steps.refs.outputs.base }}. Please run: git fetch origin && git rebase origin/${{ steps.refs.outputs.base }}"
            exit 1
          fi

      - name: Verify no merge commits
        shell: bash
        run: |
          merges=$(git log --merges --oneline "origin/${{ steps.refs.outputs.base }}..${{ steps.refs.outputs.head }}" || true)
          if [ -n "$merges" ]; then
            echo "::error::The PR branch contains merge commits, which are not allowed on protected branches. Rebase and remove them:"
            echo "$merges"
            exit 1
          fi

      - name: Check for leftover conflict markers
        shell: bash
        run: |
          if ! git diff --check "origin/${{ steps.refs.outputs.base }}..${{ steps.refs.outputs.head }}"; then
            echo "::error::Conflict markers or whitespace errors found in the PR diff."
            exit 1
          fi
