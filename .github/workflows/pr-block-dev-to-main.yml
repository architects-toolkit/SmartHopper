
name: Warn Dev Release to Main

# Description: This workflow warns when a development release version is being
# merged into a protected release branch (main, release/*, hotfix/*). It no
# longer blocks the merge; the warning is visible in the PR check summary and as
# a PR comment.
#
# Trigger: Automatically when a pull request is opened or updated targeting
# main, release/*, or hotfix/* and touches Solution.props.
#
# Permissions:
# - contents:read - Required to read repository content
# - pull-requests:write - Required to post a warning comment on the PR

on:
  pull_request:
    branches:
      - main
      - 'hotfix/**'
      - 'release/**'
    paths:
      - 'Solution.props'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  warn-dev-release:
    name: Warn Dev Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get version from Solution.props
        id: get-version
        uses: ./.github/actions/versioning/get-version

      - name: Warn on dev release
        id: check-dev
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          echo "Version found: $VERSION"

          if [[ $VERSION == *"-dev"* ]]; then
            echo "::warning::Development release versions (-dev) are being merged into a protected branch."
            echo "is_dev_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dev_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post warning comment
        if: steps.check-dev.outputs.is_dev_release == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.get-version.outputs.version }}';
            const prNumber = context.payload.pull_request.number;
            const body = `⚠️ **Dev release warning**\n\nThis PR contains a development version \`${version}\`. Merging it into a protected branch is allowed, but please confirm this is intentional.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const marker = '⚠️ **Dev release warning**';
            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
