name: pr-milestone

# PR Milestone Assignment Workflow
# Automatically assigns PRs to milestones based on version in Solution.props

on:
  pull_request:
    types: [opened]
    branches: [main, 'release/**', 'hotfix/**', 'hash-update/*']

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assign-pr-to-milestone:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
    - name: Checkout PR source branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
      
    - name: Read version from Solution.props and assign to milestone
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Read Solution.props file
          const solutionPropsPath = 'Solution.props';
          
          if (!fs.existsSync(solutionPropsPath)) {
            console.log('Solution.props file not found');
            return;
          }
          
          const content = fs.readFileSync(solutionPropsPath, 'utf8');
          console.log('Solution.props content:', content);
          
          // Extract version from Solution.props
          const versionMatch = content.match(/<SolutionVersion>(.*?)<\/SolutionVersion>/);
          if (!versionMatch) {
            console.log('Could not find SolutionVersion in Solution.props');
            return;
          }
          
          const fullVersion = versionMatch[1];
          console.log('Found full version:', fullVersion);
          
          // Parse and process version
          // Milestones are named by the stage the PR is targeting, not the exact build/sequence.
          // - stable X.Y.Z -> milestone X.Y.Z
          // - pre-release X.Y.Z-stage.N -> milestone X.Y.Z-stage
          // - development X.Y.Z-dev[.date][.seq] -> milestone X.Y.Z-alpha (pre-alpha)
          //
          // Examples: "0.4.0-dev.250720" -> "0.4.0-alpha"
          //           "0.4.0-alpha" -> "0.4.0-alpha"
          //           "0.4.0-alpha.1" -> "0.4.0-alpha"
          //           "0.4.0-beta.2" -> "0.4.0-beta"

          const match = fullVersion.match(/^(\d+)\.(\d+)\.(\d+)(?:-(.+))?$/);
          if (!match) {
            console.log('Could not parse version as semantic version');
            return;
          }

          const coreVersion = `${match[1]}.${match[2]}.${match[3]}`;
          const suffix = match[4] || '';
          let processedVersion;

          if (!suffix) {
            // Stable release target
            processedVersion = coreVersion;
          } else {
            // Stage is the first segment of the suffix; dev is pre-alpha
            const stage = suffix.split('.')[0].toLowerCase();
            if (stage === 'dev') {
              processedVersion = `${coreVersion}-alpha`;
            } else {
              processedVersion = `${coreVersion}-${stage}`;
            }
          }

          console.log('Processed version for milestone:', processedVersion);
          
          // Find milestone with matching title — paginate to walk through ALL
          // milestones (default page size is 30, and the repo has more than that).
          const milestones = await github.paginate(github.rest.issues.listMilestones, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'all', // Include both open and closed milestones
            per_page: 100
          });
          
          let targetMilestone = milestones.find(milestone => milestone.title === processedVersion);
          
          if (!targetMilestone) {
            console.log(`No milestone found with title: ${processedVersion}`);
            console.log('Available milestones:', milestones.map(m => m.title));
            
            // Create the milestone if it doesn't exist
            console.log(`Creating new milestone: ${processedVersion}`);
            try {
              const { data: newMilestone } = await github.rest.issues.createMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: processedVersion,
                description: `Milestone for version ${processedVersion}`,
                state: 'open'
              });
              
              targetMilestone = newMilestone;
              console.log(`Successfully created milestone: ${targetMilestone.title}`);
              
            } catch (error) {
              // GitHub returns 422 with error code "already_exists" when a milestone
              // with the same title already exists. This can happen if pagination
              // missed it or another job created it concurrently — recover by
              // re-listing and picking up the existing one instead of failing.
              const msg = error.message || '';
              if (error.status === 422 && /already[_ ]exists/.test(msg)) {
                console.log(`ℹ️ Milestone ${processedVersion} already exists — re-listing to find it`);
                const refreshed = await github.paginate(github.rest.issues.listMilestones, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'all',
                  per_page: 100
                });
                targetMilestone = refreshed.find(m => m.title === processedVersion);
                if (!targetMilestone) {
                  core.setFailed(`Milestone ${processedVersion} reported as already_exists but could not be found after re-listing.`);
                  return;
                }
                console.log(`Found existing milestone after re-list: ${targetMilestone.title} (${targetMilestone.state})`);
              } else {
                console.error('Error creating milestone:', error);
                core.setFailed(`Failed to create milestone: ${error.message}`);
                return;
              }
            }
          } else {
            console.log(`Found existing milestone: ${targetMilestone.title} (${targetMilestone.state})`);
          }
          
          // Assign PR to milestone
          try {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              milestone: targetMilestone.number
            });
            
            console.log(`Successfully assigned PR #${context.payload.pull_request.number} to milestone "${targetMilestone.title}"`);
            
            // Add a comment to the PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🏷️ This PR has been automatically assigned to milestone **${targetMilestone.title}** based on the version in \`Solution.props\`.`
            });
            
          } catch (error) {
            console.error('Error assigning PR to milestone:', error);
            core.setFailed(`Failed to assign PR to milestone: ${error.message}`);
          }
