name: pr-milestone

# PR Milestone Assignment Workflow
# Automatically assigns PRs to milestones and version: labels based on version in Solution.props

on:
  pull_request:
    types: [opened]
    branches: [main, 'release/**', 'hotfix/**', 'hash-update/*']

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assign-pr-to-milestone:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
    - name: Checkout PR source branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
      
    - name: Assign PR to milestone and apply version label
      uses: ./.github/actions/milestone/assign-pr
      with:
        pr-number: ${{ github.event.pull_request.number }}
        token: ${{ secrets.GITHUB_TOKEN }}
