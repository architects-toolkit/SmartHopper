name: PR Notes

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-notes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      !startsWith(github.event.pull_request.head.ref, 'release-prep/') &&
      !startsWith(github.event.pull_request.head.ref, 'chore/bump-') &&
      !startsWith(github.event.pull_request.head.ref, 'backport/') &&
      !startsWith(github.event.pull_request.head.ref, 'hash-update/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prepare PR context
        id: context
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          CONTEXT_DIR="$RUNNER_TEMP/pr-notes"
          mkdir -p "$CONTEXT_DIR"

          COMMITS=$(git log --format='%s' "$BASE_SHA..$HEAD_SHA" || true)
          FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" || true)
          DIFF=$(git diff --no-ext-diff --unified=3 "$BASE_SHA...$HEAD_SHA" || true)

          # git patch-id produces a hash that ignores whitespace, line numbers and
          # context-only changes, so formatting/merge noise does not look like a new
          # diff on the next run.
          DIFF_PATCH_ID=$(printf '%s' "$DIFF" | git patch-id --stable 2>/dev/null | cut -d' ' -f1 || true)

          UNRELEASED=$(awk '/^## \[Unreleased\]/{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md || true)

          COMMITS_FILE="$CONTEXT_DIR/commits.txt"
          FILES_FILE="$CONTEXT_DIR/files.txt"
          DIFF_FILE="$CONTEXT_DIR/diff.txt"
          UNRELEASED_FILE="$CONTEXT_DIR/unreleased.txt"

          printf '%s' "$COMMITS" > "$COMMITS_FILE"
          printf '%s' "$FILES" > "$FILES_FILE"
          printf '%s' "$DIFF" > "$DIFF_FILE"
          printf '%s' "$UNRELEASED" > "$UNRELEASED_FILE"

          CONTEXT_DIR="$CONTEXT_DIR" COMMITS_FILE="$COMMITS_FILE" FILES_FILE="$FILES_FILE" DIFF_FILE="$DIFF_FILE" \
          UNRELEASED_FILE="$UNRELEASED_FILE" DIFF_PATCH_ID="$DIFF_PATCH_ID" \
          python3 - "$CONTEXT_DIR/data.json" "$CONTEXT_DIR/prompt" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          output_path = pathlib.Path(sys.argv[1])
          prompt_path = pathlib.Path(sys.argv[2])
          template = pathlib.Path(".github/prompts/pr-notes.md").read_text(encoding="utf-8")

          # mistral-medium-latest has a 256k-token context window. Reserve 4k
          # for the generated response and another 4k for JSON/message overhead.
          # Assuming a conservative 3 characters per token for mixed code/English
          # text gives the character budget below. The diff is then capped so the
          # full prompt (template + branch + commits + files + unreleased + diff)
          # fits inside that budget.
          CONTEXT_WINDOW_TOKENS = 256000
          MAX_OUTPUT_TOKENS = 4096
          SAFETY_TOKENS = 4096
          CHARS_PER_TOKEN = 3.0
          input_budget_chars = int(
              (CONTEXT_WINDOW_TOKENS - MAX_OUTPUT_TOKENS - SAFETY_TOKENS) * CHARS_PER_TOKEN
          )

          context_dir = pathlib.Path(os.environ["CONTEXT_DIR"])

          commits = pathlib.Path(os.environ["COMMITS_FILE"]).read_text(encoding="utf-8")
          files = pathlib.Path(os.environ["FILES_FILE"]).read_text(encoding="utf-8")
          raw_diff = pathlib.Path(os.environ["DIFF_FILE"]).read_text(encoding="utf-8")
          unreleased = pathlib.Path(os.environ["UNRELEASED_FILE"]).read_text(encoding="utf-8")
          head_branch = os.environ["HEAD_BRANCH"]

          # Prefer git patch-id (whitespace/context-insensitive) for diff equality
          # comparisons, but fall back to the raw diff hash if patch-id is empty.
          diff_hash = os.environ.get("DIFF_PATCH_ID", "").strip()
          if not diff_hash:
              diff_hash = hashlib.sha256(raw_diff.encode("utf-8")).hexdigest()

          diff_truncated = "false"
          raw_diff_truncated_note = "The raw diff was not truncated."

          values = {
              "HEAD_BRANCH": head_branch,
              "COMMIT_MESSAGES": commits,
              "CHANGED_FILES": files,
              "RAW_DIFF": "",
              "RAW_DIFF_TRUNCATED": raw_diff_truncated_note,
              "UNRELEASED": unreleased,
          }

          non_diff_template = template.replace("{{RAW_DIFF}}", "", 1)
          for key, value in values.items():
              if key != "RAW_DIFF":
                  non_diff_template = non_diff_template.replace("{{" + key + "}}", value)

          non_diff_len = len(non_diff_template)
          diff_max_chars = max(10240, input_budget_chars - non_diff_len)
          diff_max_lines = min(20000, max(1000, int(diff_max_chars / 20)))

          # Truncate by characters first, then by line count.
          if len(raw_diff) > diff_max_chars:
              raw_diff = raw_diff[:diff_max_chars]
              diff_truncated = "true"
              raw_diff_truncated_note = "The raw diff was truncated to fit within the model context window."

          if raw_diff.count("\n") + 1 > diff_max_lines:
              raw_diff = "\n".join(raw_diff.splitlines()[:diff_max_lines])
              diff_truncated = "true"
              raw_diff_truncated_note = "The raw diff was truncated to fit within the model context window."

          values["RAW_DIFF"] = raw_diff
          values["RAW_DIFF_TRUNCATED"] = raw_diff_truncated_note

          for key, value in values.items():
              template = template.replace("{{" + key + "}}", value)

          (context_dir / "diff-truncated.txt").write_text(raw_diff, encoding="utf-8")

          prompt_path.write_text(template, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gh_out:
              gh_out.write(f"diff-hash={diff_hash}\n")
              gh_out.write(f"diff-truncated-file={context_dir / 'diff-truncated.txt'}\n")

          output_path.write_text(json.dumps({
              "head_sha": os.environ["HEAD_SHA"],
              "diff_hash": diff_hash,
              "head_branch": head_branch,
              "commits": commits,
              "files": files,
              "prompt": template,
          }), encoding="utf-8")
          PY
          {
            echo "prompt-file=$CONTEXT_DIR/prompt"
            echo "commits-file=$COMMITS_FILE"
            echo "files-file=$FILES_FILE"
          } >> "$GITHUB_OUTPUT"
      - name: Assess previous suggestion and diff
        id: assess-prep
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DIFF_HASH: ${{ steps.context.outputs.diff-hash }}
          DIFF_TRUNCATED_FILE: ${{ steps.context.outputs.diff-truncated-file }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import re
          import subprocess

          pr_number = os.environ["PR_NUMBER"]
          repo = os.environ["GITHUB_REPOSITORY"]
          diff_hash = os.environ["DIFF_HASH"]
          diff_truncated_file = os.environ["DIFF_TRUNCATED_FILE"]
          context_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr-notes"
          context_dir.mkdir(parents=True, exist_ok=True)

          def gh_api(*args):
              return subprocess.check_output(["gh", "api"] + list(args), text=True, env=os.environ)

          first_run = "true"
          diff_changed = "true"
          needs_severity = "false"
          should_generate = "true"
          previous_comment_id = ""
          previous_title = ""
          previous_body = ""
          previous_title_file = str(context_dir / "previous-title.txt")
          previous_body_file = str(context_dir / "previous-body.txt")
          severity_prompt_file = str(context_dir / "severity-prompt.txt")

          try:
              result = gh_api(
                  f"repos/{repo}/issues/{pr_number}/comments",
                  "--paginate",
                  "--jq",
                  'map(select(.body | contains("<!-- pr-notes:suggestion -->"))) | if length > 0 then last | {id, body} else null end',
              )
              data = json.loads(result)
              if data and data.get("body"):
                  previous_comment_id = str(data.get("id", ""))
                  previous_comment_body = data.get("body", "")
                  meta_match = re.search(r"<!-- pr-notes:meta\s+([^>]+)\s*-->", previous_comment_body)
                  previous_diff_hash = ""
                  if meta_match:
                      try:
                          meta = json.loads(base64.b64decode(meta_match.group(1)).decode("utf-8"))
                          previous_title = meta.get("title", "")
                          previous_body = meta.get("body", "")
                          previous_diff_hash = meta.get("diff_hash", "")
                      except Exception:
                          pass

                  pathlib.Path(previous_title_file).write_text(previous_title, encoding="utf-8")
                  pathlib.Path(previous_body_file).write_text(previous_body, encoding="utf-8")

                  first_run = "false"
                  if diff_hash == previous_diff_hash:
                      diff_changed = "false"
                      needs_severity = "false"
                      should_generate = "false"
                  else:
                      diff_changed = "true"
                      needs_severity = "true"
                      should_generate = ""
              else:
                  first_run = "true"
                  diff_changed = "true"
                  needs_severity = "false"
                  should_generate = "true"
          except Exception as e:
              print(f"::warning::Failed to fetch previous suggestion: {e}")
              first_run = "true"
              diff_changed = "true"
              needs_severity = "false"
              should_generate = "true"

          if needs_severity == "true":
              diff_text = pathlib.Path(diff_truncated_file).read_text(encoding="utf-8")
              severity_template = pathlib.Path(".github/prompts/pr-notes-severity.md").read_text(encoding="utf-8")
              prompt = (
                  severity_template
                  .replace("{{PREVIOUS_TITLE}}", previous_title)
                  .replace("{{PREVIOUS_BODY}}", previous_body)
                  .replace("{{RAW_DIFF}}", diff_text)
              )
              pathlib.Path(severity_prompt_file).write_text(prompt, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"first_run={first_run}\n")
              f.write(f"diff_changed={diff_changed}\n")
              f.write(f"previous-title-file={previous_title_file}\n")
              f.write(f"previous-body-file={previous_body_file}\n")
              f.write(f"needs_severity={needs_severity}\n")
              f.write(f"severity-prompt-file={severity_prompt_file}\n")
              f.write(f"should_generate={should_generate}\n")
              f.write(f"previous-comment-id={previous_comment_id}\n")
          PY

      - name: Determine change severity with Mistral
        id: severity
        if: steps.assess-prep.outputs.needs_severity == 'true'
        uses: ./.github/actions/ai/mistral-chat
        with:
          api-key: ${{ secrets.MISTRAL_API_KEY }}
          model: mistral-medium-latest
          temperature: '0.0'
          max-tokens: '10'
          user-prompt-file: ${{ steps.assess-prep.outputs.severity-prompt-file }}

      - name: Decide whether to generate PR notes
        id: assess-decide
        if: always() && steps.assess-prep.outputs.needs_severity == 'true'
        shell: bash
        env:
          SEVERITY_SUCCESS: ${{ steps.severity.outputs.success || 'false' }}
          SEVERITY_RESPONSE: ${{ steps.severity.outputs.response || '' }}
          GITHUB_OUTPUT: ${{ github.output }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gh_out:
              if os.environ.get("SEVERITY_SUCCESS") != "true":
                  gh_out.write("should_generate=false\n")
                  print("Changes are minor; skipping PR notes generation.")
                  raise SystemExit(0)

              text = os.environ.get("SEVERITY_RESPONSE", "").lower()
              # Strip common Markdown/LLM decoration around the single word.
              text = re.sub(r"[`'*#\"]+", "", text)
              matches = re.findall(r"\b(yes|no|true|false)\b", text)

              if matches and matches[0] in ("yes", "true"):
                  gh_out.write("should_generate=true\n")
                  print("Changes are substantial; will generate PR notes.")
              else:
                  gh_out.write("should_generate=false\n")
                  print("Changes are minor; skipping PR notes generation.")
          PY

      - name: Generate PR notes
        id: ai
        if: steps.assess-prep.outputs.should_generate == 'true' || steps.assess-decide.outputs.should_generate == 'true'
        uses: ./.github/actions/ai/mistral-chat
        with:
          api-key: ${{ secrets.MISTRAL_API_KEY }}
          model: mistral-medium-latest
          temperature: '0.3'
          max-tokens: '4096'
          user-prompt-file: ${{ steps.context.outputs.prompt-file }}
      - name: Post PR notes suggestion and update title
        if: always() && (steps.assess-prep.outputs.should_generate == 'true' || steps.assess-decide.outputs.should_generate == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_SUCCESS: ${{ steps.ai.outputs.success || 'false' }}
          AI_RESPONSE: ${{ steps.ai.outputs.response || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          FIRST_RUN: ${{ steps.assess-prep.outputs.first_run }}
          PREVIOUS_TITLE_FILE: ${{ steps.assess-prep.outputs.previous-title-file }}
          PREVIOUS_BODY_FILE: ${{ steps.assess-prep.outputs.previous-body-file }}
          DIFF_HASH: ${{ steps.context.outputs.diff-hash }}
          COMMITS_FILE: ${{ steps.context.outputs.commits-file }}
          FILES_FILE: ${{ steps.context.outputs.files-file }}
        run: |
          set -euo pipefail

          python3 - "$RUNNER_TEMP/pr-notes-result.json" <<'PY'
          import base64
          import json
          import os
          import pathlib
          import re
          import sys

          valid_types = "feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security|release"
          title_pattern = rf"^({valid_types})(\([a-z0-9-]+\))?:\ .+"
          response = os.environ.get("AI_RESPONSE", "")
          current_title = os.environ.get("CURRENT_TITLE", "")
          head_sha = os.environ["HEAD_SHA"]
          head_branch = os.environ["HEAD_BRANCH"]
          first_run = os.environ.get("FIRST_RUN") == "true"
          diff_hash = os.environ.get("DIFF_HASH", "")

          def _read_file_or_empty(path):
              return pathlib.Path(path).read_text(encoding="utf-8") if path else ""

          commits = _read_file_or_empty(os.environ.get("COMMITS_FILE", "")).splitlines()
          files = _read_file_or_empty(os.environ.get("FILES_FILE", "")).splitlines()
          previous_title = _read_file_or_empty(os.environ.get("PREVIOUS_TITLE_FILE", ""))
          previous_body = _read_file_or_empty(os.environ.get("PREVIOUS_BODY_FILE", ""))

          blocks = re.findall(r"```[^\n]*\n([\s\S]*?)```", response)
          llm_title = blocks[0].strip() if len(blocks) >= 2 else ""
          llm_body = blocks[1].strip() if len(blocks) >= 2 else ""
          ai_ok = os.environ.get("AI_SUCCESS") == "true" and bool(llm_title and llm_body)

          static_body = _read_file_or_empty(".github/prompts/pr-notes-static.md").strip()

          def normalize_ai_body(body):
              matches = list(re.finditer(r"(?m)^##\s+(Description|Breaking Changes)\s*$", body))
              sections = {}
              for index, match in enumerate(matches):
                  end = matches[index + 1].start() if index + 1 < len(matches) else len(body)
                  sections.setdefault(match.group(1), body[match.end():end].strip())
              if "Description" not in sections or "Breaking Changes" not in sections:
                  return ""
              return "\n".join([
                  "## Description",
                  sections["Description"],
                  "",
                  "## Breaking Changes",
                  sections["Breaking Changes"],
                  "",
                  static_body,
              ]).strip()

          def fallback_title():
              slug = re.sub(r"[^a-z0-9]+", " ", head_branch.lower()).strip()
              branch_type, _, branch_description = slug.partition(" ")
              if branch_type not in valid_types.split("|"):
                  branch_description = slug
                  branch_type = "chore"
              description = branch_description or "update pull request"
              return f"{branch_type}: {description}"

          if ai_ok:
              llm_body = normalize_ai_body(llm_body)
              ai_ok = bool(llm_body)

          if not ai_ok:
              llm_title = fallback_title()
              llm_body = "\n".join([
                  "> **Fallback:** LLM-generated PR notes were unavailable; this summary was generated from repository metadata.",
                  "",
                  "## Description",
                  "This pull request contains the changes listed below.",
                  "",
                  "## Breaking Changes",
                  "No breaking changes identified from the available metadata.",
                  "",
                  static_body,
                  "",
                  "### Commits",
                  *(f"- {item}" for item in commits[:20]),
                  "",
                  "### Changed files",
                  *(f"- `{item}`" for item in files[:100]),
              ]).strip()

          if not re.fullmatch(title_pattern, llm_title):
              llm_title = fallback_title()

          if not first_run and not ai_ok:
              # Do not post fallback suggestions on subsequent runs.
              json.dump({
                  "skip": True,
                  "suggested_title": llm_title,
                  "suggested_body": llm_body,
              }, open(sys.argv[1], "w", encoding="utf-8"))
              raise SystemExit(0)

          suggestion_changed = first_run or previous_title != llm_title or previous_body != llm_body
          title_needs_update = current_title != llm_title

          if not suggestion_changed and not title_needs_update:
              json.dump({
                  "skip": True,
                  "suggested_title": llm_title,
                  "suggested_body": llm_body,
              }, open(sys.argv[1], "w", encoding="utf-8"))
              raise SystemExit(0)

          meta = base64.b64encode(json.dumps({
              "sha": head_sha,
              "diff_hash": diff_hash,
              "title": llm_title,
              "body": llm_body,
          }, ensure_ascii=False).encode("utf-8")).decode("ascii")

          title_code = f"```text\n{llm_title}\n```"
          body_code = f"```markdown\n{llm_body}\n```"

          if first_run:
              comment = "\n".join([
                  "<!-- pr-notes:suggestion -->",
                  "",
                  "### Suggested PR title",
                  "",
                  title_code,
                  "",
                  "### Suggested PR description",
                  "",
                  body_code,
                  "",
                  f"<!-- pr-notes:meta {meta} -->",
              ])
          else:
              changed_items = []
              if previous_title != llm_title:
                  changed_items.append("title")
              if previous_body != llm_body:
                  changed_items.append("description")
              if changed_items:
                  reason = f"The PR has changed since the last suggestion ({' and '.join(changed_items)}), so the PR title and/or description should be updated."
              else:
                  reason = "The PR has changed since the last suggestion, so the PR title should be updated."

              details = "\n".join([
                  "<details>",
                  "<summary>Suggested updated PR title and description</summary>",
                  "",
                  "### Suggested PR title",
                  "",
                  title_code,
                  "",
                  "### Suggested PR description",
                  "",
                  body_code,
                  "",
                  f"<!-- pr-notes:meta {meta} -->",
                  "</details>",
              ])

              comment = "\n".join([
                  "<!-- pr-notes:suggestion -->",
                  "",
                  reason,
                  "",
                  details,
              ])

          json.dump({
              "skip": False,
              "suggested_title": llm_title,
              "suggested_body": llm_body,
              "title_needs_update": title_needs_update,
              "comment": comment,
          }, open(sys.argv[1], "w", encoding="utf-8"))
          PY

          RESULT="$RUNNER_TEMP/pr-notes-result.json"
          SUGGESTED_TITLE=$(jq -r '.suggested_title' "$RESULT")
          SUGGESTED_BODY=$(jq -r '.suggested_body' "$RESULT")
          SKIP=$(jq -r '.skip' "$RESULT")
          TITLE_NEEDS_UPDATE=$(jq -r '.title_needs_update // false' "$RESULT")

          if [[ "$SKIP" == "true" ]]; then
            echo "PR notes suggestion is up to date; skipping."
            exit 0
          fi

          COMMENT_BODY=$(jq -r '.comment' "$RESULT")

          if [[ "$TITLE_NEEDS_UPDATE" == "true" ]]; then
            gh api --method PATCH "repos/${{ github.repository }}/pulls/$PR_NUMBER" -f title="$SUGGESTED_TITLE" >/dev/null
            echo "Updated PR title to: $SUGGESTED_TITLE"
          fi

          gh api --method POST "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" -f body="$COMMENT_BODY" >/dev/null
          echo "Posted PR notes suggestion comment."
