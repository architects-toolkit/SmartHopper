name: PR Notes

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['**']

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: pr-notes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      !startsWith(github.event.pull_request.head.ref, 'release-prep/') &&
      !startsWith(github.event.pull_request.head.ref, 'chore/bump-') &&
      !startsWith(github.event.pull_request.head.ref, 'backport/') &&
      !startsWith(github.event.pull_request.head.ref, 'hash-update/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prepare PR context
        id: context
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          CONTEXT_DIR="$RUNNER_TEMP/pr-notes"
          mkdir -p "$CONTEXT_DIR"

          COMMITS=$(git log --format='%s' "$BASE_SHA..$HEAD_SHA" || true)
          FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" || true)
          DIFF=$(git diff --no-ext-diff --unified=3 "$BASE_SHA...$HEAD_SHA" || true)

          UNRELEASED=$(awk '/^## \[Unreleased\]/{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md || true)

          COMMITS_FILE="$CONTEXT_DIR/commits.txt"
          FILES_FILE="$CONTEXT_DIR/files.txt"
          DIFF_FILE="$CONTEXT_DIR/diff.txt"
          UNRELEASED_FILE="$CONTEXT_DIR/unreleased.txt"

          printf '%s' "$COMMITS" > "$COMMITS_FILE"
          printf '%s' "$FILES" > "$FILES_FILE"
          printf '%s' "$DIFF" > "$DIFF_FILE"
          printf '%s' "$UNRELEASED" > "$UNRELEASED_FILE"

          COMMITS_FILE="$COMMITS_FILE" FILES_FILE="$FILES_FILE" DIFF_FILE="$DIFF_FILE" \
          UNRELEASED_FILE="$UNRELEASED_FILE" \
          python3 - "$CONTEXT_DIR/data.json" "$CONTEXT_DIR/prompt" <<'PY'
          import json
          import os
          import pathlib
          import sys

          output_path = pathlib.Path(sys.argv[1])
          prompt_path = pathlib.Path(sys.argv[2])
          template = pathlib.Path(".github/prompts/pr-notes.md").read_text(encoding="utf-8")

          # mistral-medium-latest has a 256k-token context window. Reserve 4k
          # for the generated response and another 4k for JSON/message overhead.
          # Assuming a conservative 3 characters per token for mixed code/English
          # text gives the character budget below. The diff is then capped so the
          # full prompt (template + branch + commits + files + unreleased + diff)
          # fits inside that budget.
          CONTEXT_WINDOW_TOKENS = 256000
          MAX_OUTPUT_TOKENS = 4096
          SAFETY_TOKENS = 4096
          CHARS_PER_TOKEN = 3.0
          input_budget_chars = int(
              (CONTEXT_WINDOW_TOKENS - MAX_OUTPUT_TOKENS - SAFETY_TOKENS) * CHARS_PER_TOKEN
          )

          commits = pathlib.Path(os.environ["COMMITS_FILE"]).read_text(encoding="utf-8")
          files = pathlib.Path(os.environ["FILES_FILE"]).read_text(encoding="utf-8")
          raw_diff = pathlib.Path(os.environ["DIFF_FILE"]).read_text(encoding="utf-8")
          unreleased = pathlib.Path(os.environ["UNRELEASED_FILE"]).read_text(encoding="utf-8")
          head_branch = os.environ["HEAD_BRANCH"]

          diff_truncated = "false"
          raw_diff_truncated_note = "The raw diff was not truncated."

          values = {
              "HEAD_BRANCH": head_branch,
              "COMMIT_MESSAGES": commits,
              "CHANGED_FILES": files,
              "RAW_DIFF": "",
              "RAW_DIFF_TRUNCATED": raw_diff_truncated_note,
              "UNRELEASED": unreleased,
          }

          non_diff_template = template.replace("{{RAW_DIFF}}", "", 1)
          for key, value in values.items():
              if key != "RAW_DIFF":
                  non_diff_template = non_diff_template.replace("{{" + key + "}}", value)

          non_diff_len = len(non_diff_template)
          diff_max_chars = max(10240, input_budget_chars - non_diff_len)
          diff_max_lines = min(20000, max(1000, int(diff_max_chars / 20)))

          # Truncate by characters first, then by line count.
          if len(raw_diff) > diff_max_chars:
              raw_diff = raw_diff[:diff_max_chars]
              diff_truncated = "true"
              raw_diff_truncated_note = "The raw diff was truncated to fit within the model context window."

          if raw_diff.count("\n") + 1 > diff_max_lines:
              raw_diff = "\n".join(raw_diff.splitlines()[:diff_max_lines])
              diff_truncated = "true"
              raw_diff_truncated_note = "The raw diff was truncated to fit within the model context window."

          values["RAW_DIFF"] = raw_diff
          values["RAW_DIFF_TRUNCATED"] = raw_diff_truncated_note

          for key, value in values.items():
              template = template.replace("{{" + key + "}}", value)

          prompt_path.write_text(template, encoding="utf-8")
          output_path.write_text(json.dumps({
              "head_sha": os.environ["HEAD_SHA"],
              "head_branch": head_branch,
              "commits": commits,
              "files": files,
              "prompt": template,
          }), encoding="utf-8")
          PY
          {
            echo "prompt-file=$CONTEXT_DIR/prompt"
            echo "commits-file=$COMMITS_FILE"
            echo "files-file=$FILES_FILE"
          } >> "$GITHUB_OUTPUT"
      - name: Generate PR notes
        id: ai
        uses: ./.github/actions/ai/mistral-chat
        with:
          api-key: ${{ secrets.MISTRAL_API_KEY }}
          model: mistral-medium-latest
          temperature: '0.3'
          max-tokens: '4096'
          user-prompt-file: ${{ steps.context.outputs.prompt-file }}

      - name: Post PR notes suggestion and update title
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_SUCCESS: ${{ steps.ai.outputs.success || 'false' }}
          AI_RESPONSE: ${{ steps.ai.outputs.response || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.head_ref }}
          COMMITS_FILE: ${{ steps.context.outputs.commits-file }}
          FILES_FILE: ${{ steps.context.outputs.files-file }}
        run: |
          set -euo pipefail

          PREVIOUS_COMMENT_JSON=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate --jq 'map(select(.body | contains("<!-- pr-notes:suggestion -->"))) | if length > 0 then last | {id, body} else null end')
          if [ "$PREVIOUS_COMMENT_JSON" != "null" ] && [ -n "$PREVIOUS_COMMENT_JSON" ]; then
            PREVIOUS_COMMENT_ID=$(echo "$PREVIOUS_COMMENT_JSON" | jq -r '.id // empty')
            PREVIOUS_COMMENT_BODY=$(echo "$PREVIOUS_COMMENT_JSON" | jq -r '.body // empty')
          else
            PREVIOUS_COMMENT_ID=""
            PREVIOUS_COMMENT_BODY=""
          fi
          export PREVIOUS_COMMENT_ID PREVIOUS_COMMENT_BODY

          python3 - "$RUNNER_TEMP/pr-notes-result.json" <<'PY'
          import base64
          import json
          import os
          import pathlib
          import re
          import sys

          valid_types = "feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security|release"
          title_pattern = rf"^({valid_types})(\([a-z0-9-]+\))?:\ .+"
          response = os.environ.get("AI_RESPONSE", "")
          current_title = os.environ.get("CURRENT_TITLE", "")
          head_sha = os.environ["HEAD_SHA"]
          head_branch = os.environ["HEAD_BRANCH"]
          def _read_file_or_empty(path):
              return pathlib.Path(path).read_text(encoding="utf-8") if path else ""

          commits = _read_file_or_empty(os.environ.get("COMMITS_FILE", "")).splitlines()
          files = _read_file_or_empty(os.environ.get("FILES_FILE", "")).splitlines()
          previous_comment_body = os.environ.get("PREVIOUS_COMMENT_BODY", "")

          previous_title = ""
          previous_body = ""
          previous_sha = ""
          meta_match = re.search(r"<!-- pr-notes:meta\s+([^>]+)\s*-->", previous_comment_body)
          if meta_match:
              try:
                  meta = json.loads(base64.b64decode(meta_match.group(1)).decode("utf-8"))
                  previous_title = meta.get("title", "")
                  previous_body = meta.get("body", "")
                  previous_sha = meta.get("sha", "")
              except Exception:
                  previous_title = ""
                  previous_body = ""
                  previous_sha = ""

          blocks = re.findall(r"```[^\n]*\n([\s\S]*?)```", response)
          llm_title = blocks[0].strip() if len(blocks) >= 2 else ""
          llm_body = blocks[1].strip() if len(blocks) >= 2 else ""
          ai_ok = os.environ.get("AI_SUCCESS") == "true" and bool(llm_title and llm_body)

          def normalize_ai_body(body):
              matches = list(re.finditer(r"(?m)^##\s+(Description|Breaking Changes)\s*$", body))
              sections = {}
              for index, match in enumerate(matches):
                  end = matches[index + 1].start() if index + 1 < len(matches) else len(body)
                  sections.setdefault(match.group(1), body[match.end():end].strip())
              if "Description" not in sections or "Breaking Changes" not in sections:
                  return ""
              return "\n".join([
                  "## Description",
                  sections["Description"],
                  "",
                  "## Breaking Changes",
                  sections["Breaking Changes"],
                  "",
                  "## Testing Done",
                  "_Not verified by automation — to be completed by the author._",
                  "",
                  "## Checklist",
                  "- [ ] This PR is focused on a single feature or bug fix",
                  "- [ ] Version in Solution.props was updated, if necessary, and follows semantic versioning",
                  "- [ ] CHANGELOG.md has been updated",
                  "- [ ] PR title follows Conventional Commits format",
                  "- [ ] PR description follows the Pull Request Description Template",
              ]).strip()

          def fallback_title():
              slug = re.sub(r"[^a-z0-9]+", " ", head_branch.lower()).strip()
              branch_type, _, branch_description = slug.partition(" ")
              if branch_type not in valid_types.split("|"):
                  branch_description = slug
                  branch_type = "chore"
              description = branch_description or "update pull request"
              return f"{branch_type}: {description}"

          if ai_ok:
              llm_body = normalize_ai_body(llm_body)
              ai_ok = bool(llm_body)

          if not ai_ok:
              llm_title = fallback_title()
              llm_body = "\n".join([
                  "> **Fallback:** LLM-generated PR notes were unavailable; this summary was generated from repository metadata.",
                  "",
                  "## Description",
                  "This pull request contains the changes listed below.",
                  "",
                  "## Breaking Changes",
                  "No breaking changes identified from the available metadata.",
                  "",
                  "## Testing Done",
                  "_Not verified by automation — to be completed by the author._",
                  "",
                  "## Checklist",
                  "- [ ] This PR is focused on a single feature or bug fix",
                  "- [ ] Version in Solution.props was updated, if necessary, and follows semantic versioning",
                  "- [ ] CHANGELOG.md has been updated",
                  "- [ ] PR title follows Conventional Commits format",
                  "- [ ] PR description follows the Pull Request Description Template",
                  "",
                  "### Commits",
                  *(f"- {item}" for item in commits[:20]),
                  "",
                  "### Changed files",
                  *(f"- `{item}`" for item in files[:100]),
              ]).strip()

          if not re.fullmatch(title_pattern, llm_title):
              llm_title = fallback_title()

          suggestion_changed = not previous_comment_body or previous_title != llm_title or previous_body != llm_body
          title_needs_update = current_title != llm_title

          if not suggestion_changed and not title_needs_update:
              json.dump({
                  "skip": True,
                  "suggested_title": llm_title,
                  "suggested_body": llm_body,
              }, open(sys.argv[1], "w", encoding="utf-8"))
              raise SystemExit(0)

          meta = base64.b64encode(json.dumps({
              "sha": head_sha,
              "title": llm_title,
              "body": llm_body,
          }, ensure_ascii=False).encode("utf-8")).decode("ascii")

          title_code = f"```text\n{llm_title}\n```"
          body_code = f"```markdown\n{llm_body}\n```"

          if not previous_comment_body:
              comment = "\n".join([
                  "<!-- pr-notes:suggestion -->",
                  "",
                  "### Suggested PR title",
                  "",
                  title_code,
                  "",
                  "### Suggested PR description",
                  "",
                  body_code,
                  "",
                  f"<!-- pr-notes:meta {meta} -->",
              ])
          else:
              changed_items = []
              if previous_title != llm_title:
                  changed_items.append("title")
              if previous_body != llm_body:
                  changed_items.append("description")
              if changed_items:
                  reason = f"The PR has changed since the last suggestion ({' and '.join(changed_items)}), so the PR title and/or description should be updated."
              else:
                  reason = "The PR has changed since the last suggestion, so the PR title should be updated."

              details = "\n".join([
                  "<details>",
                  "<summary>Suggested updated PR title and description</summary>",
                  "",
                  "### Suggested PR title",
                  "",
                  title_code,
                  "",
                  "### Suggested PR description",
                  "",
                  body_code,
                  "",
                  f"<!-- pr-notes:meta {meta} -->",
                  "</details>",
              ])

              comment = "\n".join([
                  "<!-- pr-notes:suggestion -->",
                  "",
                  reason,
                  "",
                  details,
              ])

          json.dump({
              "skip": False,
              "suggested_title": llm_title,
              "suggested_body": llm_body,
              "title_needs_update": title_needs_update,
              "comment": comment,
          }, open(sys.argv[1], "w", encoding="utf-8"))
          PY

          RESULT="$RUNNER_TEMP/pr-notes-result.json"
          SUGGESTED_TITLE=$(jq -r '.suggested_title' "$RESULT")
          SUGGESTED_BODY=$(jq -r '.suggested_body' "$RESULT")
          SKIP=$(jq -r '.skip' "$RESULT")
          TITLE_NEEDS_UPDATE=$(jq -r '.title_needs_update // false' "$RESULT")

          if [[ "$SKIP" == "true" ]]; then
            echo "PR notes suggestion is up to date; skipping."
            exit 0
          fi

          COMMENT_BODY=$(jq -r '.comment' "$RESULT")

          if [[ "$TITLE_NEEDS_UPDATE" == "true" ]]; then
            gh api --method PATCH "repos/${{ github.repository }}/pulls/$PR_NUMBER" -f title="$SUGGESTED_TITLE" >/dev/null
            echo "Updated PR title to: $SUGGESTED_TITLE"
          fi

          gh api --method POST "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" -f body="$COMMENT_BODY" >/dev/null
          echo "Posted PR notes suggestion comment."

          if [[ "$BASE_REF" == "main" || "$BASE_REF" == hotfix/* || "$BASE_REF" == release/* ]]; then
            gh workflow run pr-validation.yml --ref "$HEAD_REF" -f pr_number="$PR_NUMBER" -f base_ref="$BASE_REF" -f pr_title="$SUGGESTED_TITLE" >/dev/null
            echo "Dispatched pr-validation workflow."
          fi
