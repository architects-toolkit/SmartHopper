name: Sync dev from main

# Description: When `main` moves ahead of `dev`, this workflow opens a PR that
# merges the latest `main` changes into `dev`. Because `dev` no longer requires
# linear history, this uses a normal merge/PR via the default GITHUB_TOKEN and
# does not need a force-push bypass PAT.
#
# Triggers:
# - push to main
# - workflow_dispatch
#
# Permissions:
# - contents: write (to push the sync branch)
# - pull-requests: write (to create the sync PR)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: "sync-dev-from-main"
  cancel-in-progress: true

jobs:
  sync:
    name: Open PR to merge main into dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Configure git user
        shell: bash
        run: |
          git config user.name "${{ vars.SMARTHOPPER_BOT_NAME }}"
          git config user.email "${{ vars.SMARTHOPPER_BOT_EMAIL }}"

      - name: Fetch main and check sync status
        id: check
        shell: bash
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "dev is up to date with main"
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            echo "dev is behind main"
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fast-forward dev and stage merge from main
        id: merge
        if: steps.check.outputs.behind == 'true'
        shell: bash
        run: |
          git fetch origin dev
          if ! git merge-base --is-ancestor origin/dev HEAD; then
            echo "::warning::Local dev is behind origin/dev; fast-forwarding before merging main"
            if ! git merge --ff-only origin/dev; then
              echo "::error::Could not fast-forward dev onto origin/dev. Resolve manually."
              exit 1
            fi
          fi

          if git merge --no-commit --no-ff origin/main; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            git merge --abort || true
            echo "::error::Merge from main into dev failed due to conflicts. Manual resolution required."
            exit 1
          fi

      - name: Create Pull Request
        if: steps.merge.outputs.merged == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync main into dev"
          title: "chore: sync main into dev"
          body: |
            This PR brings the latest `main` changes into `dev`.

            Because `dev` no longer requires linear history, this was generated as a merge/sync PR using the default `GITHUB_TOKEN`.

            After merging, `dev` will be up to date with `main` and ready for a future `dev → main` release PR.

            _Auto-generated by `.github/workflows/sync-dev-from-main.yml`._
          branch: "chore/sync-dev-from-main-${{ github.run_id }}"
          base: dev
          delete-branch: true
          labels: |
            automated

      - name: Open issue on conflict
        if: failure() && steps.merge.outputs.merged != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = 'dev-sync';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 1
            });
            const body = `Automatic sync of \`main\` into \`dev\` failed because the merge could not be completed automatically.` +
              `\n\nPlease resolve the conflicts manually and merge \`main\` into \`dev\`:` +
              `\n\`\`\`bash\n` +
              `git fetch origin\n` +
              `git checkout dev\n` +
              `git merge origin/main\n` +
              `\`\`\``;
            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'dev sync from main failed',
                body,
                labels: [label]
              });
            }
