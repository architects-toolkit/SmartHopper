name: Notify dev rebase from main

# Description: When `main` moves ahead of `dev`, this workflow opens or updates a
# GitHub issue asking the maintainer to rebase `dev` onto `origin/main` and
# force-push. Because `dev` now uses squash merges only, `main` cannot be merged
# into `dev` with a merge commit; the correct integration is a rebase.
#
# Triggers:
# - push to main
# - workflow_dispatch
#
# Permissions:
# - issues: write (to create/update the notification issue)
# - contents: read (to fetch refs)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: "sync-dev-from-main"
  cancel-in-progress: true

jobs:
  notify:
    name: Check if dev needs rebase from main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Fetch main and check sync status
        id: check
        shell: bash
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "dev is up to date with main"
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            echo "dev is not up to date with main and needs rebase"
            echo "behind=true" >> "$GITHUB_OUTPUT"
            echo "main_head=$(git rev-parse --short origin/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update rebase notification issue
        if: steps.check.outputs.behind == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = 'dev-sync';
            const mainHead = '${{ steps.check.outputs.main_head }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `\`main\` has moved ahead of \`dev\` (main HEAD \`${mainHead}\`).` +
              ` Because \`dev\` is configured for squash merges only, a merge commit cannot be used to bring \`main\` into \`dev\`.` +
              `\n\nPlease rebase \`dev\` onto \`origin/main\` and force-push (you will need bypass/force-push permissions):` +
              `\n\`\`\`bash\n` +
              `git fetch origin\n` +
              `git checkout dev\n` +
              `git rebase --autostash origin/main\n` +
              `git push --force-with-lease origin dev\n` +
              `\`\`\`\n\n` +
              `_Auto-detected by \`.github/workflows/sync-dev-from-main.yml\` ([run](${runUrl}))._`;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 1
            });

            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body
              });
              console.log(`Updated issue #${existing[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Action required: rebase dev onto main',
                body,
                labels: [label, 'automated', 'status: needs attention']
              });
              console.log(`Created issue #${issue.number}`);
            }

      - name: Close notification issue when dev is up to date
        if: steps.check.outputs.behind == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = 'dev-sync';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 10
            });

            for (const issue of existing) {
              if (issue.title === 'Action required: rebase dev onto main') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  body: `${issue.body || ''}\n\n---\n\`dev\` is now up to date with \`main\`. Closing.`
                });
                console.log(`Closed issue #${issue.number}`);
              }
            }
