name: Stabilization 2 - Promote Release Line

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      line:
        description: Optional X.Y release line to process
        required: false
        default: ''
        type: string
      force-promote:
        description: Promote without eligibility checks
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: stabilization-promotion
  cancel-in-progress: false

jobs:
  discover-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lines: ${{ steps.discover.outputs.lines }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Discover active release lines
        id: discover
        uses: ./.github/actions/versioning/discover-release-lines
        with:
          line: ${{ inputs.line }}

  promote:
    needs: discover-lines
    if: needs.discover-lines.outputs.lines != '[]'
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.discover-lines.outputs.lines) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: stabilization-promotion-${{ matrix.line }}
      cancel-in-progress: false
    steps:
      - name: Checkout release line
        uses: actions/checkout@v4
        with:
          ref: release/${{ matrix.line }}
          fetch-depth: 0

      # The release line may predate the composite actions used by this
      # workflow, so use the actions from the workflow's main branch.
      - name: Check out CI tooling from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .ci-tooling
          fetch-depth: 1
      - name: Sync composite actions from main
        run: |
          rm -rf .github/actions
          cp -R .ci-tooling/.github/actions .github/actions
          rm -rf .ci-tooling

      - name: Determine promotion threshold
        id: threshold
        shell: bash
        env:
          CONFIGURED_AGE: ${{ vars.PROMOTION_AGE_DAYS }}
        run: |
          set -euo pipefail
          AGE="${CONFIGURED_AGE:-15}"
          if [[ ! "$AGE" =~ ^[0-9]+$ ]]; then
            echo "::error::Promotion age '$AGE' is not a non-negative integer." >&2
            exit 1
          fi
          echo "days=$AGE" >> "$GITHUB_OUTPUT"

      - name: Find newest release tag on line
        id: tag
        shell: bash
        env:
          LINE: ${{ matrix.line }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          BRANCH="origin/release/${LINE}"
          mapfile -t TAGS < <(git tag --merged "$BRANCH")
          CURRENT_TAG=$(python3 - "${LINE}" "${TAGS[@]}" <<'PY'
          import re
          import sys

          line = sys.argv[1]
          pattern = re.compile(
              rf"^{re.escape(line)}\.(\d+)(?:-(alpha|beta|rc)(?:\.(\d+))?)?$"
          )
          rank = {"alpha": 0, "beta": 1, "rc": 2, None: 3}
          candidates = []
          for tag in sys.argv[2:]:
              match = pattern.fullmatch(tag)
              if not match:
                  continue
              patch = int(match.group(1))
              stage = match.group(2)
              number = int(match.group(3) or (1 if stage else 0))
              candidates.append(((patch, rank[stage], number), tag))
          print(max(candidates)[1] if candidates else "")
          PY
          )

          if [[ -z "$CURRENT_TAG" ]]; then
            CORE="${LINE}.0"
            CURRENT_STAGE=""
            NEXT_STAGE="alpha"
            NEXT_MILESTONE="${CORE}-alpha"
          else
            CORE="${CURRENT_TAG%%-*}"
            if [[ "$CURRENT_TAG" == *-* ]]; then
              CURRENT_STAGE="${CURRENT_TAG#*-}"
              CURRENT_STAGE="${CURRENT_STAGE%%.*}"
            else
              CURRENT_STAGE="stable"
            fi
            case "$CURRENT_STAGE" in
              alpha) NEXT_STAGE=beta ;;
              beta) NEXT_STAGE=rc ;;
              rc) NEXT_STAGE=stable ;;
              stable) NEXT_STAGE="" ;;
              *) echo "::error::Unsupported release stage in '$CURRENT_TAG'." >&2; exit 1 ;;
            esac
            if [[ "$NEXT_STAGE" == stable ]]; then
              NEXT_MILESTONE="$CORE"
            elif [[ -n "$NEXT_STAGE" ]]; then
              NEXT_MILESTONE="$CORE-$NEXT_STAGE"
            else
              NEXT_MILESTONE=""
            fi
          fi

          {
            echo "current-tag=$CURRENT_TAG"
            echo "current-stage=$CURRENT_STAGE"
            echo "core=$CORE"
            echo "next-stage=$NEXT_STAGE"
            echo "next-milestone=$NEXT_MILESTONE"
          } >> "$GITHUB_OUTPUT"

      - name: Enumerate release versions on line
        id: line-versions
        shell: bash
        env:
          LINE: ${{ matrix.line }}
        run: |
          set -euo pipefail
          versions=$(git tag --list "${LINE}.*" |
            LINE="$LINE" python3 -c '
          import json
          import os
          import re
          import sys
          line = os.environ["LINE"]
          pattern = re.compile(rf"^{re.escape(line)}\.[0-9]+(?:-[0-9A-Za-z.-]+)?$")
          print(json.dumps([tag.strip() for tag in sys.stdin if pattern.fullmatch(tag.strip())]))
          ')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

      - name: Check open issues across release line
        id: check-line-issues
        uses: actions/github-script@v9
        env:
          VERSIONS: ${{ steps.line-versions.outputs.versions }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const versions = JSON.parse(process.env.VERSIONS || '[]');
            const normalizedVersions = new Set(versions.map(version => {
              const match = version.match(/^(\d+\.\d+\.\d+(?:-[^.+]+)?)/);
              return match ? match[1] : version;
            }));
            const versionLabels = new Set(
              [...normalizedVersions].map(version => `version: ${version}`)
            );
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const matches = issues.filter(issue =>
              !issue.pull_request &&
              issue.labels.some(label => versionLabels.has(label.name))
            );
            const matchedVersions = [...new Set(matches.flatMap(issue =>
              issue.labels
                .map(label => label.name)
                .filter(label => versionLabels.has(label))
                .map(label => label.substring('version: '.length))
            ))].sort();
            core.setOutput('has-issues', String(matches.length > 0));
            core.setOutput('issue-count', String(matches.length));
            core.setOutput('versions', matchedVersions.join(', '));

      - name: Check issues and release age
        id: check-issues
        if: steps.tag.outputs.current-tag != ''
        uses: ./.github/actions/versioning/check-issues-for-version
        with:
          version: ${{ steps.tag.outputs.current-tag }}
          days-lookback: ${{ steps.threshold.outputs.days }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check promotion freeze
        id: check-freeze
        uses: actions/github-script@v9
        env:
          CORE: ${{ steps.tag.outputs.core }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = `version: ${process.env.CORE}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'promotion: freeze',
              state: 'open',
              per_page: 100,
            });
            const frozen = issues.some(issue =>
              issue.labels.some(item => item.name === label)
            );
            core.setOutput('frozen', String(frozen));

      - name: Determine promotion eligibility
        id: evaluate
        shell: bash
        env:
          CURRENT_TAG: ${{ steps.tag.outputs.current-tag }}
          NEXT_STAGE: ${{ steps.tag.outputs.next-stage }}
          ISSUE_COUNT: ${{ steps.check-line-issues.outputs.issue-count }}
          HAS_ISSUES: ${{ steps.check-line-issues.outputs.has-issues }}
          ISSUE_VERSIONS: ${{ steps.check-line-issues.outputs.versions }}
          RELEASE_OLD_ENOUGH: ${{ steps.check-issues.outputs.release-old-enough }}
          RELEASE_AGE: ${{ steps.check-issues.outputs.release-age-days }}
          FROZEN: ${{ steps.check-freeze.outputs.frozen }}
          FORCE_PROMOTE: ${{ inputs.force-promote }}
        run: |
          set -euo pipefail
          ELIGIBLE=true
          PAST_THRESHOLD=false
          REASONS=()

          if [[ -z "$NEXT_STAGE" ]]; then
            ELIGIBLE=false
            REASONS+=("stable release already exists")
          elif [[ -z "$CURRENT_TAG" ]]; then
            REASONS+=("no staged release exists; starting alpha")
          elif [[ "$RELEASE_OLD_ENOUGH" == true ]]; then
            PAST_THRESHOLD=true
          else
            REASONS+=("staged release age is ${RELEASE_AGE:-unknown} days")
          fi

          if [[ "$FORCE_PROMOTE" == true ]]; then
            ELIGIBLE=true
            REASONS=("force-promote enabled")
          elif [[ -n "$NEXT_STAGE" && -n "$CURRENT_TAG" ]]; then
            if [[ "$HAS_ISSUES" == true ]]; then
              ELIGIBLE=false
              REASONS+=("${ISSUE_COUNT:-unknown} open issue(s) for release line versions: ${ISSUE_VERSIONS:-unknown}")
            fi
            if [[ "$RELEASE_OLD_ENOUGH" != true ]]; then
              ELIGIBLE=false
              REASONS+=("release is younger than the promotion threshold")
            fi
            if [[ "$FROZEN" == true ]]; then
              ELIGIBLE=false
              REASONS+=("promotion: freeze is active for ${CURRENT_TAG%%-*}")
            fi
          elif [[ -n "$NEXT_STAGE" && "$FROZEN" == true ]]; then
            ELIGIBLE=false
            REASONS+=("promotion: freeze is active for the release line")
          fi

          if [[ "${#REASONS[@]}" -eq 0 ]]; then
            REASONS+=("all promotion conditions are satisfied")
          fi
          REASON=$(IFS='; '; echo "${REASONS[*]}")
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
          echo "past-threshold=$PAST_THRESHOLD" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Dispatch next-stage preparation
        if: steps.evaluate.outputs.eligible == 'true' && steps.tag.outputs.next-stage != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: release/${{ matrix.line }}
          NEXT_STAGE: ${{ steps.tag.outputs.next-stage }}
        run: |
          set -euo pipefail
          gh workflow run release-1-prepare.yml \
            --ref main \
            -f bump=none \
            -f stage="$NEXT_STAGE" \
            -f target-branch="$RELEASE_BRANCH"

      - name: Create or update blocked promotion issue
        if: steps.evaluate.outputs.eligible != 'true' && steps.evaluate.outputs.past-threshold == 'true' && steps.tag.outputs.current-tag != ''
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.tag.outputs.current-tag }}
          REASON: ${{ steps.evaluate.outputs.reason }}
          ISSUE_VERSIONS: ${{ steps.check-line-issues.outputs.versions }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = `⛔ Promotion blocked: ${process.env.VERSION}`;
            const body = [
              `Promotion of \`${process.env.VERSION}\` is blocked.`,
              '',
              `**Condition:** ${process.env.REASON}`,
              `**Open issue versions:** ${process.env.ISSUE_VERSIONS || 'none'}`,
              '',
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['automated', 'status: needs attention'],
              });
            }

      - name: Write promotion summary
        if: always()
        shell: bash
        env:
          LINE: ${{ matrix.line }}
          CURRENT_TAG: ${{ steps.tag.outputs.current-tag || 'none' }}
          NEXT_STAGE: ${{ steps.tag.outputs.next-stage || 'none' }}
          ELIGIBLE: ${{ steps.evaluate.outputs.eligible || 'no' }}
          REASON: ${{ steps.evaluate.outputs.reason || 'workflow failed before eligibility was evaluated' }}
        run: |
          {
            echo "## Stabilization promotion"
            echo
            echo "| Line | Current tag | Next stage | Eligible | Reason |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| $LINE | $CURRENT_TAG | $NEXT_STAGE | $ELIGIBLE | $REASON |"
          } >> "$GITHUB_STEP_SUMMARY"
