name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        required: true
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none
      stage:
        description: Version stage
        required: true
        type: choice
        options:
          - dev
          - alpha
          - beta
          - rc
          - stable
        default: dev
      base-branch:
        description: Branch to base the version bump on
        required: true
        type: string
        default: main
      auto-merge:
        description: Enable rebase auto-merge for the bump PR
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.base-branch }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base-branch }}
          fetch-depth: 0

      - name: Get current version
        id: current-version
        uses: ./.github/actions/versioning/get-version

      - name: Calculate next version
        id: next-version
        uses: ./.github/actions/versioning/next-version
        with:
          current-version: ${{ steps.current-version.outputs.version }}
          bump: ${{ inputs.bump }}
          stage: ${{ inputs.stage }}

      - name: Set version and refresh badges
        uses: ./.github/actions/versioning/version-manager
        with:
          mode: set-version
          new-version: ${{ steps.next-version.outputs.new-version }}

      - name: Check changed files
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git status --porcelain | awk '{print $2}' | grep -vE '^(Solution.props|README.md)$' || true)
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected files changed by version bump:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Create bump pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            Solution.props
            README.md
          commit-message: "chore: bump version to ${{ steps.next-version.outputs.new-version }}"
          title: "chore: bump version to ${{ steps.next-version.outputs.new-version }}"
          body: |
            Updates the canonical version to `${{ steps.next-version.outputs.new-version }}` and refreshes the README badges.

            This automated pull request isolates the version bump instead of pushing directly to `${{ inputs.base-branch }}`.
          branch: "chore/bump-${{ steps.next-version.outputs.new-version }}"
          base: ${{ inputs.base-branch }}
          delete-branch: true
          labels: |
            automated

      - name: Dispatch required PR checks
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: ./.github/actions/dispatch-required-pr-checks
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ steps.create-pr.outputs.pull-request-branch }}
          pr-number: ${{ steps.create-pr.outputs.pull-request-number }}
          base-ref: ${{ inputs.base-branch }}
          pr-title: "chore: bump version to ${{ steps.next-version.outputs.new-version }}"

      - name: Enable rebase auto-merge
        if: inputs.auto-merge == true && steps.create-pr.outputs.pull-request-url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq '.number')
          gh pr merge "$PR_NUMBER" --auto --rebase
