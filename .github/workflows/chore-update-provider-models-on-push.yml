name: 🔄 Update DEV.md Provider Models

# Description: Keeps the provider model summary in DEV.md in sync with the
# *ProviderModels.cs source files. Pushes to protected branches open an automated
# PR when documentation changes; not triggered by pull requests, so it cannot
# block an incoming PR.

on:
  push:
    branches:
      - main
      - 'hotfix/**'
      - 'release/**'
    paths:
      - 'src/SmartHopper.Providers.*/[A-Z]*ProviderModels.cs'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-provider-models:
    name: Update DEV.md provider models
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Run Update-DevProviderModels.ps1
        id: update
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          pwsh -ExecutionPolicy Bypass -File .\tools\Update-DevProviderModels.ps1
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            "changed=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          } elseif ($code -eq 1) {
            "changed=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          } else {
            throw "Update-DevProviderModels.ps1 failed with exit code $code"
          }
          $global:LASTEXITCODE = 0

      - name: Emit step summary
        if: always()
        shell: pwsh
        run: |
          $changed = '${{ steps.update.outputs.changed }}'
          if ($changed -eq 'true') {
            Write-Output "## DEV.md provider model table updated" >> $env:GITHUB_STEP_SUMMARY
            Write-Output "The provider model table in ``DEV.md`` was refreshed from ``*ProviderModels.cs``." >> $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Output "## No changes needed" >> $env:GITHUB_STEP_SUMMARY
            Write-Output "The provider model table in ``DEV.md`` is already up to date." >> $env:GITHUB_STEP_SUMMARY
          }

      # Derive a per-base branch slug. The workflow runs on several base branches
      # (main, hotfix/**, release/**); a single shared PR branch
      # name would be reused across different bases and the PR would then list
      # commits from whichever base it was last built on. Namespacing the branch
      # by base keeps each base's sync PR isolated. Slashes are replaced with '-'.
      - name: Compute PR branch slug
        id: slug
        if: github.event_name == 'push' && steps.update.outputs.changed == 'true'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $slug = $env:REF_NAME -replace '[/ ]', '-'
          "value=$slug" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: Rebase onto latest ${{ github.ref_name }}
        if: github.event_name == 'push' && steps.update.outputs.changed == 'true'
        uses: ./.github/actions/utils/rebase-onto-base
        with:
          base-ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-name: ${{ vars.SMARTHOPPER_BOT_NAME }}
          bot-email: ${{ vars.SMARTHOPPER_BOT_EMAIL }}

      - name: Create Pull Request
        if: github.event_name == 'push' && steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update provider model summary [ci skip]"
          title: "docs: sync provider model summary (${{ github.ref_name }})"
          body: |
            Auto-generated PR from `.github/workflows/chore-update-provider-models-on-push.yml`.

            The provider model summary in `DEV.md` has been refreshed to reflect
            the current default and verified models declared in each
            `*ProviderModels.cs` file.
          branch: "chore/update-provider-models-${{ steps.slug.outputs.value }}"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: |
            automated
            documentation
