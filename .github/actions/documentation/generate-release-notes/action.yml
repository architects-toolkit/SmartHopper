# Release notes generation action for SmartHopper.
# Contains the domain logic for generating user-friendly release notes
# from the CHANGELOG.md using the Mistral AI Chat Completions API.
#
# The prompts are stored in .github/prompts/ directory:
# - release-notes-major-minor.md for major/minor releases
# - release-notes-patch.md for patch releases
# - release-notes-dev.md for development releases
# and should be kept in sync with those files when the release notes format changes.

name: 'Generate Release Notes'
description: 'Generate AI-powered release notes from CHANGELOG.md using Mistral AI'

inputs:
  version:
    description: 'Full version string (e.g., 1.4.2-alpha)'
    required: true
  major:
    description: 'Major version component'
    required: true
  minor:
    description: 'Minor version component'
    required: true
  patch:
    description: 'Patch version component'
    required: true
  suffix:
    description: 'Version suffix (e.g., alpha)'
    required: false
    default: ''
  mistral-api-key:
    description: 'Mistral AI API key (passed through to mistral-chat)'
    required: true
  model:
    description: 'Mistral model name'
    required: false
    default: 'mistral-medium-latest'
  changelog-path:
    description: 'Path to the CHANGELOG.md file'
    required: false
    default: 'CHANGELOG.md'

outputs:
  title:
    description: 'Generated release title'
    value: ${{ steps.parse_response.outputs.title }}
  body:
    description: 'Generated release notes body'
    value: ${{ steps.parse_response.outputs.body }}

runs:
  using: 'composite'
  steps:
    - name: Extract changelog section
      id: extract_changelog
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        CHANGELOG_PATH: ${{ inputs.changelog-path }}
      run: |
        # Extract content between ## [$VERSION] and the next ## [ heading
        SECTION=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" "$CHANGELOG_PATH" | sed '$d')

        if [ -z "$SECTION" ]; then
          echo "::warning::Could not find changelog section for version $VERSION"
          echo "fallback=true" >> "$GITHUB_OUTPUT"
          SECTION="No changelog section found for version $VERSION."
        else
          echo "fallback=false" >> "$GITHUB_OUTPUT"
        fi

        {
          echo "changelog_section<<EOF_CHANGELOG"
          echo "$SECTION"
          echo "EOF_CHANGELOG"
        } >> "$GITHUB_OUTPUT"

    - name: Determine release type
      id: release_type
      shell: bash
      env:
        PATCH: ${{ inputs.patch }}
        SUFFIX: ${{ inputs.suffix }}
      run: |
        if [ "$PATCH" != "0" ]; then
          echo "type=patch" >> "$GITHUB_OUTPUT"
        elif [ -n "$SUFFIX" ] && [[ "$SUFFIX" =~ ^dev(\.|$) ]]; then
          echo "type=dev" >> "$GITHUB_OUTPUT"
        else
          echo "type=major-minor" >> "$GITHUB_OUTPUT"
        fi

    - name: Build system prompt and static content
      id: build_prompt
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SUFFIX: ${{ inputs.suffix }}
        RELEASE_TYPE: ${{ steps.release_type.outputs.type }}
      run: |
        if [ "$RELEASE_TYPE" = "major-minor" ]; then
          # Determine stage language for Important Notes section
          if [ -n "$SUFFIX" ]; then
            STAGE_LINE="- This is a pre-release with some features still unstable or subject to change"
          else
            STAGE_LINE="- This is a stable release"
          fi

          # Read the major/minor prompt from the prompts directory
          SYSTEM_PROMPT=$(python3 - "$VERSION" <<'PY'
        import pathlib
        import sys
        
        template_path = pathlib.Path(".github/prompts/release-notes-major-minor.md")
        content = template_path.read_text(encoding="utf-8")
        
        # Replace placeholders
        content = content.replace("${VERSION}", sys.argv[1])
        
        print(content)
        PY
          )
          
          # Load static content for major/minor and replace STAGE_LINE
          STATIC_CONTENT=$(python3 - "$STAGE_LINE" <<'PY'
        import pathlib
        import sys
        
        template_path = pathlib.Path(".github/prompts/release-notes-major-minor-static.md")
        content = template_path.read_text(encoding="utf-8")
        
        # Replace STAGE_LINE placeholder
        content = content.replace("${STAGE_LINE}", sys.argv[1])
        
        print(content)
        PY
          )
        elif [ "$RELEASE_TYPE" = "dev" ]; then
          # Read the dev prompt from the prompts directory
          SYSTEM_PROMPT=$(python3 - "$VERSION" <<'PY'
        import pathlib
        import sys
        
        template_path = pathlib.Path(".github/prompts/release-notes-dev.md")
        content = template_path.read_text(encoding="utf-8")
        
        # Replace placeholders
        content = content.replace("${VERSION}", sys.argv[1])
        
        print(content)
        PY
          )
          
          # Load static content for dev
          STATIC_CONTENT=$(python3 <<'PY'
        import pathlib
        
        template_path = pathlib.Path(".github/prompts/release-notes-dev-static.md")
        print(template_path.read_text(encoding="utf-8"))
        PY
          )
        else
          # Patch release - read the patch prompt from the prompts directory
          SYSTEM_PROMPT=$(python3 - "$VERSION" <<'PY'
        import pathlib
        import sys
        
        template_path = pathlib.Path(".github/prompts/release-notes-patch.md")
        content = template_path.read_text(encoding="utf-8")
        
        # Replace placeholders
        content = content.replace("${VERSION}", sys.argv[1])
        
        print(content)
        PY
          )
          
          # Load static content for patch
          STATIC_CONTENT=$(python3 <<'PY'
        import pathlib
        
        template_path = pathlib.Path(".github/prompts/release-notes-patch-static.md")
        print(template_path.read_text(encoding="utf-8"))
        PY
          )
        fi

        {
          echo "system_prompt<<EOF_SYSTEM_PROMPT"
          echo "$SYSTEM_PROMPT"
          echo "EOF_SYSTEM_PROMPT"
        } >> "$GITHUB_OUTPUT"
        
        {
          echo "static_content<<EOF_STATIC"
          echo "$STATIC_CONTENT"
          echo "EOF_STATIC"
        } >> "$GITHUB_OUTPUT"

    - name: Call Mistral AI
      id: ai_call
      uses: ./.github/actions/ai/mistral-chat
      with:
        api-key: ${{ inputs.mistral-api-key }}
        model: ${{ inputs.model }}
        system-prompt: ${{ steps.build_prompt.outputs.system_prompt }}
        user-prompt: |
          Generate release notes for version ${{ inputs.version }} from this changelog:

          ${{ steps.extract_changelog.outputs.changelog_section }}

    - name: Parse title and body from AI response
      id: parse_response
      shell: bash
      env:
        AI_RESPONSE: ${{ steps.ai_call.outputs.response }}
        AI_SUCCESS: ${{ steps.ai_call.outputs.success }}
        VERSION: ${{ inputs.version }}
        CHANGELOG_SECTION: ${{ steps.extract_changelog.outputs.changelog_section }}
        STATIC_CONTENT: ${{ steps.build_prompt.outputs.static_content }}
      run: |
        if [ "$AI_SUCCESS" = "true" ] && [ -n "$AI_RESPONSE" ]; then
          # First line is the title, rest is the body
          TITLE=$(echo "$AI_RESPONSE" | head -n 1)
          BODY=$(echo "$AI_RESPONSE" | tail -n +3)

          # Append static content to the body
          FULL_BODY="${BODY}

          ${STATIC_CONTENT}"

          echo "::notice::AI release notes generated successfully"
        else
          echo "::warning::AI generation failed or returned empty, using fallback"
          TITLE="SmartHopper $VERSION: <add an engaging title here>"
          BODY="$CHANGELOG_SECTION"
          FULL_BODY="${BODY}

          ${STATIC_CONTENT}"
        fi

        {
          echo "title<<EOF_TITLE"
          echo "$TITLE"
          echo "EOF_TITLE"
        } >> "$GITHUB_OUTPUT"

        {
          echo "body<<EOF_BODY"
          echo "$FULL_BODY"
          echo "EOF_BODY"
        } >> "$GITHUB_OUTPUT"
