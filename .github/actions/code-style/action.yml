name: "Code Style"
description: "Run code-style checks/fixes: formatting, headers, etc."
inputs:
  mode:
    description: "Operation mode: fix or check"
    required: false
    default: "check"
  commit:
    description: "Commit?"
    required: false
    default: false
  token:
    description: "GitHub token for creating a PR if the branch is protected"
    required: false
    default: ${{ github.token }}
  bot-name:
    description: "Git user.name for the commit"
    required: false
    default: ""
  bot-email:
    description: "Git user.email for the commit"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Check for existing .NET SDK
      id: check-dotnet
      shell: bash
      run: |
        if dotnet --version >/dev/null 2>&1; then
          echo "installed=true" >> $GITHUB_OUTPUT
        else
          echo "installed=false" >> $GITHUB_OUTPUT
        fi
    - name: Setup .NET
      if: ${{ steps.check-dotnet.outputs.installed == 'false' }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'
    # - name: Run dotnet-format
    #   shell: bash
    #   run: |
    #     dotnet restore
    #     dotnet tool install -g dotnet-format || true
    #     export PATH="$HOME/.dotnet/tools:$PATH"
    #     if [ "${{ inputs.mode }}" = "check" ]; then
    #       dotnet format --verify-no-changes
    #     else
    #       dotnet format
    #     fi
    - id: whitespace
      name: Process trailing whitespace
      continue-on-error: ${{ inputs.mode == 'check' }}
      uses: ./.github/actions/code-style/trailing-whitespace
      with:
        mode: ${{ inputs.mode }}
    - id: using_sorter
      name: Process using directives
      continue-on-error: ${{ inputs.mode == 'check' }}
      uses: ./.github/actions/code-style/using-sorter
      with:
        mode: ${{ inputs.mode }}
    - id: namespace_fixer
      name: Check namespaces
      continue-on-error: ${{ inputs.mode == 'check' }}
      uses: ./.github/actions/code-style/namespace-fixer
      with:
        mode: soft-check
    - name: Fail on check errors
      if: ${{ inputs.mode == 'check' && (steps.header.outcome == 'failure' || steps.whitespace.outcome == 'failure' || steps.using_sorter.outcome == 'failure' || steps.namespace_fixer.outcome == 'failure') }}
      run: exit 1
    - name: Stage code-style changes
      if: ${{ inputs.commit }}
      shell: bash
      run: git add .

    - name: Commit and push (or open PR if protected)
      if: ${{ inputs.commit }}
      uses: ./.github/actions/utils/safe-commit
      with:
        commit-message: "chore: automatically fix code style"
        pr-title: "chore: automatically fix code style"
        pr-body: "Automated code style fixes applied by the Code Style action."
        token: ${{ inputs.token }}
        bot-name: ${{ inputs.bot-name }}
        bot-email: ${{ inputs.bot-email }}
