name: Move Milestone Items
description: Moves open issues and PRs from one or more closed milestones to a target milestone

inputs:
  closed-milestone-title:
    description: 'Title of a single closed milestone (used when closed-milestone-titles is empty)'
    required: true
  closed-milestone-titles:
    description: 'Newline-separated list of closed milestone titles; if provided, closed-milestone-title is ignored'
    required: false
    default: ''
  target-milestone-title:
    description: 'Optional target milestone title; if omitted the target is derived from the first closed milestone'
    required: false
    default: ''
  token:
    description: 'GitHub token with issues:write permission'
    required: true

outputs:
  target-milestone:
    description: 'Title of the target milestone items were moved to'
    value: ${{ steps.move.outputs.target-milestone }}
  items-moved:
    description: 'Number of items moved'
    value: ${{ steps.move.outputs.items-moved }}

runs:
  using: composite
  steps:
    - name: Move items to target milestone
      id: move
      uses: actions/github-script@v7
      env:
        CLOSED_MILESTONE_TITLE: ${{ inputs.closed-milestone-title }}
        CLOSED_MILESTONE_TITLES: ${{ inputs.closed-milestone-titles }}
        TARGET_MILESTONE_TITLE: ${{ inputs.target-milestone-title }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          // ===== SHARED VERSION UTILITIES (used across versioning actions) =====
          // Parse semantic version from string
          function parseVersion(versionStr) {
            const match = versionStr.match(/^(\d+)\.(\d+)\.(\d+)(?:-(.+))?$/);
            if (!match) return null;

            return {
              major: parseInt(match[1]),
              minor: parseInt(match[2]),
              patch: parseInt(match[3]),
              prerelease: match[4] || null,
              suffix: match[4] || null,
              original: versionStr
            };
          }

          // Format version object back to string
          function formatVersion(version) {
            let versionStr = `${version.major}.${version.minor}.${version.patch}`;
            const suffix = version.prerelease || version.suffix;
            if (suffix) {
              versionStr += `-${suffix}`;
            }
            return versionStr;
          }
          // ===== END SHARED VERSION UTILITIES =====

          // Find a milestone by title, optionally limiting by state
          async function findMilestoneByTitle(title, state) {
            const params = { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 };
            if (state) {
              params.state = state;
            }
            const milestones = await github.paginate(github.rest.issues.listMilestones, params);
            return milestones.find(m => m.title === title) || null;
          }

          // Create new milestone
          async function createMilestone(title, description) {
            try {
              const response = await github.rest.issues.createMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                description: description || `Auto-created milestone for version ${title}`
              });
              console.log(`Created new milestone: ${title}`);
              return response.data;
            } catch (error) {
              const msg = error.message || '';
              if (error.status === 422 && /already[_ ]exists/.test(msg)) {
                console.log(`Milestone ${title} already exists (concurrent creation). Fetching...`);
                const existing = await findMilestoneByTitle(title, 'all');
                if (!existing) {
                  throw new Error(`Milestone exists but could not be found: ${error.message}`);
                }
                return existing;
              }
              throw error;
            }
          }

          // Get open issues and PRs for a milestone
          async function getOpenItemsInMilestone(milestoneNumber) {
            const [issues, pulls] = await Promise.all([
              github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone: milestoneNumber,
                state: 'open'
              }),
              github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open'
              })
            ]);

            const prsInMilestone = pulls.data.filter(pr =>
              pr.milestone && pr.milestone.number === milestoneNumber
            );

            return {
              issues: issues.data.filter(issue => !issue.pull_request),
              prs: prsInMilestone
            };
          }

          // Move item to new milestone
          async function moveItemToMilestone(itemNumber, newMilestoneNumber) {
            try {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: itemNumber,
                milestone: newMilestoneNumber
              });
              console.log(`Successfully moved item #${itemNumber} to milestone #${newMilestoneNumber}`);
              return true;
            } catch (error) {
              console.error(`Failed to move item #${itemNumber}:`, error.message);
              return false;
            }
          }

          const titlesRaw = process.env.CLOSED_MILESTONE_TITLES || '';
          let closedMilestoneTitles = [];
          if (titlesRaw.trim().length > 0) {
            closedMilestoneTitles = titlesRaw.split('\n').map(t => t.trim()).filter(t => t.length > 0);
          } else {
            closedMilestoneTitles = [process.env.CLOSED_MILESTONE_TITLE];
          }

          // Resolve the closed milestones. Prefer the webhook payload for the first title, otherwise look it up by title.
          const closedMilestones = [];
          for (let i = 0; i < closedMilestoneTitles.length; i++) {
            const title = closedMilestoneTitles[i];
            console.log(`Resolving milestone: ${title}`);
            let milestone = null;
            if (i === 0 && context.payload.milestone && context.payload.milestone.title === title) {
              milestone = context.payload.milestone;
              console.log(`Using closed milestone from event payload: #${milestone.number}`);
            } else {
              milestone = await findMilestoneByTitle(title, 'all');
              if (!milestone) {
                console.log(`Milestone '${title}' not found, skipping.`);
                continue;
              }
              console.log(`Resolved milestone by title: #${milestone.number}`);
            }
            closedMilestones.push(milestone);
          }

          if (closedMilestones.length === 0) {
            console.log('No closed milestones found, exiting.');
            core.setOutput('target-milestone', '');
            core.setOutput('items-moved', '0');
            return;
          }

          // Collect open items from all source milestones
          const allIssues = [];
          const allPrs = [];
          for (const milestone of closedMilestones) {
            const openItems = await getOpenItemsInMilestone(milestone.number);
            console.log(`Milestone '${milestone.title}': ${openItems.issues.length} open issues, ${openItems.prs.length} open PRs`);
            allIssues.push(...openItems.issues);
            allPrs.push(...openItems.prs);
          }
          const totalItems = allIssues.length + allPrs.length;

          if (totalItems === 0) {
            console.log('No open items to move, exiting.');
            core.setOutput('target-milestone', '');
            core.setOutput('items-moved', '0');
            return;
          }

          // Determine target milestone
          let targetMilestone = null;
          const requestedTargetTitle = process.env.TARGET_MILESTONE_TITLE;

          // Extract stage from prerelease (e.g., 'alpha' from 'alpha.240101')
          function getStage(prerelease) {
            if (!prerelease || prerelease === 'stable') return 'stable';
            return prerelease.split('.')[0].toLowerCase();
          }

          // Get next stage in stabilization path
          function getNextStage(stage) {
            if (stage === 'alpha') return 'beta';
            if (stage === 'beta') return 'rc';
            if (stage === 'rc') return null; // stable (no suffix)
            return null;
          }

          // Check whether a parent stabilization milestone (X.Y.Z, no suffix) is still open
          async function findOpenStabilizationMilestone(major, minor, patch) {
            const parentTitle = `${major}.${minor}.${patch}`;
            return await findMilestoneByTitle(parentTitle, 'open');
          }

          if (requestedTargetTitle) {
            // Caller provided an explicit target (e.g., a pre-computed next alpha from the release job)
            console.log(`Using requested target milestone: ${requestedTargetTitle}`);
            targetMilestone = await findMilestoneByTitle(requestedTargetTitle, 'open');
            if (!targetMilestone) {
              targetMilestone = await createMilestone(requestedTargetTitle, `Milestone for version ${requestedTargetTitle}`);
            }
          } else {
            // Derive the target from the first closed milestone
            const closedMilestoneTitle = closedMilestoneTitles[0];
            const closedVersion = parseVersion(closedMilestoneTitle);
            if (!closedVersion) {
              console.log('First milestone title is not a valid semantic version, skipping target derivation.');
              core.setOutput('target-milestone', '');
              core.setOutput('items-moved', '0');
              return;
            }

            // For alpha, beta, rc: check if we're in a stabilization path first
            if (closedVersion.prerelease && closedVersion.prerelease !== 'stable') {
              const stage = getStage(closedVersion.prerelease);
              const parentMilestone = await findOpenStabilizationMilestone(
                closedVersion.major, closedVersion.minor, closedVersion.patch
              );

              if (parentMilestone) {
                // Stabilization path: route to same series next stage
                const nextStage = getNextStage(stage);
                const nextStageSuffix = nextStage ? `-${nextStage}` : '';
                const nextStageTitle = `${closedVersion.major}.${closedVersion.minor}.${closedVersion.patch}${nextStageSuffix}`;
                console.log(`Stabilization path detected (parent milestone '${parentMilestone.title}' is open). Routing to: ${nextStageTitle}`);
                targetMilestone = await findMilestoneByTitle(nextStageTitle, 'open');
                if (!targetMilestone) {
                  targetMilestone = await createMilestone(nextStageTitle, `Stabilization path milestone for ${nextStageTitle}`);
                }
              } else {
                // Normal dev path: move to next minor alpha
                const nextMinorAlpha = {
                  major: closedVersion.major,
                  minor: closedVersion.minor + 1,
                  patch: 0,
                  prerelease: 'alpha'
                };
                const nextMinorAlphaTitle = formatVersion(nextMinorAlpha);
                console.log(`Closed milestone is ${closedVersion.prerelease} (stage: ${stage}), looking for next minor alpha: ${nextMinorAlphaTitle}`);
                targetMilestone = await findMilestoneByTitle(nextMinorAlphaTitle, 'open');
                if (!targetMilestone) {
                  targetMilestone = await createMilestone(nextMinorAlphaTitle, `Next minor alpha version after ${closedMilestoneTitle}`);
                }
              }
            } else {
              // For stable: always route to next minor alpha (create if needed)
              const nextMinorAlpha = {
                major: closedVersion.major,
                minor: closedVersion.minor + 1,
                patch: 0,
                prerelease: 'alpha'
              };
              const nextMinorAlphaTitle = formatVersion(nextMinorAlpha);
              console.log(`Closed stable milestone, routing to: ${nextMinorAlphaTitle}`);
              targetMilestone = await findMilestoneByTitle(nextMinorAlphaTitle, 'open');
              if (!targetMilestone) {
                targetMilestone = await createMilestone(nextMinorAlphaTitle, `Next minor alpha version after ${closedMilestoneTitle}`);
              }
            }
          }

          console.log(`Target milestone: ${targetMilestone.title}`);

          // Move all items
          const movePromises = [];

          for (const issue of allIssues) {
            console.log(`Moving issue #${issue.number}: ${issue.title}`);
            movePromises.push(moveItemToMilestone(issue.number, targetMilestone.number));
          }

          for (const pr of allPrs) {
            console.log(`Moving PR #${pr.number}: ${pr.title}`);
            movePromises.push(moveItemToMilestone(pr.number, targetMilestone.number));
          }

          const results = await Promise.all(movePromises);
          const successCount = results.filter(r => r).length;

          console.log(`Successfully moved ${successCount}/${totalItems} items to "${targetMilestone.title}"`);

          core.setOutput('target-milestone', targetMilestone.title);
          core.setOutput('items-moved', successCount.toString());
