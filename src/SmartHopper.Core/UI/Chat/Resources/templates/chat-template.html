<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>SmartHopper AI Chat</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' data: 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self';">
    <style type="text/css">
        {{cssChat}}
    </style>
    <style type="text/css">
        {{cssTheme}}
    </style>
</head>
<body>
    <!-- Floating HUD: autonomy budget overlay (only while a run is in progress)
         with the active task-plan panel docked below it -->
    <div id="hud">
        <div id="autonomy-overlay" class="hidden" role="status" aria-live="polite">
            <div id="autonomy-warning" class="autonomy-warning hidden">&#9888; No autonomy limits — unbounded run</div>
            <div id="autonomy-time-row" class="autonomy-row" title="Autonomous time used / limit">
                <span class="autonomy-icon">&#9201;</span>
                <span id="autonomy-time-text" class="autonomy-text"></span>
                <span class="autonomy-bar"><span id="autonomy-time-fill" class="autonomy-fill"></span></span>
            </div>
            <div id="autonomy-tokens-row" class="autonomy-row" title="Autonomous tokens used / limit">
                <span class="autonomy-icon">&#9889;</span>
                <span id="autonomy-tokens-text" class="autonomy-text"></span>
                <span class="autonomy-bar"><span id="autonomy-tokens-fill" class="autonomy-fill"></span></span>
            </div>
            <div id="autonomy-extend-row" class="autonomy-row hidden" title="Extend the autonomous time and token budgets by 50% each">
                <span class="autonomy-icon">+</span>
                <button id="autonomy-extend-btn" class="autonomy-extend-btn" type="button">Extend limits</button>
            </div>
        </div>
        <div id="task-plan-panel" class="hidden" role="status" aria-live="polite"></div>
    </div>

    <!-- Mount point for the vendored chat-ui toolkit shell (status line, message
         list, attachment strip, composer). chat-bridge.js mounts into this node
         and renames the toolkit message list to #chat-container. -->
    <div id="chat-root"></div>

    <!-- Plugin-owned regions relocated inside the toolkit chrome at init:
         suggested-prompt chips sit above the composer; debug actions join the
         composer row (empty + hidden in non-debug builds). -->
    <div id="suggestions-strip" class="hidden" role="list"></div>
    <div id="sh-debug-actions" class="hidden">{{debugActionsLeft}}</div>

    <script type="text/javascript" src="{{jsSanitizer}}"></script>
    <script type="text/javascript">
        {{jsVendor}}
    </script>
    <script type="text/javascript">
        {{jsChat}}
    </script>
    <script>
        // Ensure the document is ready before executing any functions
        document.addEventListener('DOMContentLoaded', function() {
            // Hooked in chat-bridge.js
        });
    </script>
</body>
</html>
